[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ti4-warlord"
version = "0.1.0"
description = "TI4 rules referee and strategy advisor: state schema, knowledge base, tools and agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "anthropic>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
pdf = ["pdfminer.six>=20231228"]

[project.scripts]
warlord = "warlord.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
warlord = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
